<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1f4d3a" />
    <meta name="description" content="読んだ本の記録・評価・書影を残すPWA" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>読書記録</title>
    <script>
      try {
        var t = localStorage.getItem('reading-log-theme')
        if (t === 'forest' || t === 'sea' || t === 'ink' || t === 'ochre' || t === 'wine') {
          document.documentElement.dataset.theme = t
          var colors = {
            forest: '#1f4d3a',
            sea: '#1e4d5c',
            ink: '#2c333a',
            ochre: '#5c4a32',
            wine: '#5c2a3a',
          }
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', colors[t])
        }
        var f = localStorage.getItem('reading-log-font')
        if (
          f === 'mincho' ||
          f === 'gothic' ||
          f === 'serif' ||
          f === 'rounded' ||
          f === 'klee' ||
          f === 'oldmincho' ||
          f === 'kaisei' ||
          f === 'yuji' ||
          f === 'yomogi' ||
          f === 'antique'
        ) {
          document.documentElement.dataset.font = f
        }
        var s = localStorage.getItem('reading-log-text-size')
        if (s === 'small' || s === 'medium' || s === 'large') {
          document.documentElement.dataset.textSize = s
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
